{% extends "base.html" %}{% block content %}
<div class="form-card"><h2>Login</h2>{% if error %}<p class="error">{{error}}</p>{% endif %}
<form method="post"><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password" required><button class="btn">Login</button></form>
<p>No account? <a href="/register">Register</a></p></div>{% endblock %}

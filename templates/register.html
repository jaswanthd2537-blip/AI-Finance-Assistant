{% extends "base.html" %}{% block content %}
<div class="form-card"><h2>Create account</h2>{% if error %}<p class="error">{{error}}</p>{% endif %}
<form method="post"><input name="name" placeholder="Name" required><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password" minlength="6" required><button class="btn">Register</button></form>
<p>Already registered? <a href="/login">Login</a></p></div>{% endblock %}
